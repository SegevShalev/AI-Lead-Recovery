name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.19
        ports:
          - 6333:6333
    env:
      MONGODB_URI: mongodb://localhost:27017/ai-lead-recovery-test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # The Qdrant vector-store tests skip when Qdrant is unreachable; make sure
      # it is up here so CI really runs them. (The image has no curl, so no service healthcheck.)
      - name: Wait for Qdrant
        run: curl -sf --retry 15 --retry-connrefused --retry-delay 1 http://localhost:6333/readyz
      - run: pnpm test
